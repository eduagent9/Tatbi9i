name: Validate app v2 foundation

on:
  push:
    branches:
      - phase1/technical-foundation
    paths:
      - 'app-v2/**'
      - '.github/workflows/foundation.yml'
  pull_request:
    paths:
      - 'app-v2/**'
      - '.github/workflows/foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-v2/package.json
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Validate SQLite schema and constraints
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          schema = Path('src/data/migrations/001_initial_schema.sql').read_text(encoding='utf-8')
          db = sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys = ON')
          db.executescript(schema)
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {'products', 'vehicles', 'stock_locations', 'stock_balances', 'stock_movements', 'invoices', 'invoice_lines', 'payments', 'cash_handovers', 'audit_events', 'sync_outbox', 'legacy_import_runs'}
          missing = required - tables
          assert not missing, f'Missing schema tables: {sorted(missing)}'
          assert db.execute('PRAGMA foreign_keys').fetchone()[0] == 1
          print(f'SQLite schema OK: {len(tables)} tables created; foreign keys enabled')
          PY

name: Validate app v2 foundation

on:
  push:
    branches:
      - phase1/technical-foundation
    paths:
      - 'app-v2/**'
      - '.github/workflows/foundation.yml'
  pull_request:
    paths:
      - 'app-v2/**'
      - '.github/workflows/foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-v2/package.json
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build

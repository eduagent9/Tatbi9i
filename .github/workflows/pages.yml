name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run static application checks
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];
          if (!scripts.length) throw new Error('No inline application script found');
          for (const script of scripts) new Function(script[1]);
          const ids = [...html.matchAll(/\\bid="([^"]+)"/g)].map(x => x[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + [...new Set(duplicates)].join(', '));
          for (const token of ['function checkout(', 'function saveReturn(', 'function saveDebtPayment(', 'function savePurchase(', 'function saveStockCount(', 'function expiryDays(', 'function backup()', 'function restore(']) {
            if (!html.includes(token)) throw new Error('Missing core feature: ' + token);
          }
          console.log('Static checks passed: JavaScript syntax, unique HTML IDs, core workflows.');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

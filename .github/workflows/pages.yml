name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run static application checks
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('No inline application script found');
          for (const script of scripts) new Function(script[1]);
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(x => x[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + [...new Set(duplicates)].join(', '));
          for (const token of ['function cartQty(', 'function checkout(', 'function saveReturn(', 'function saveDebtPayment(', 'function savePurchase(', 'function saveStockCount(', 'function deleteProduct(', 'function saveProduct(', 'function expiryDays(', 'function backup()', 'function restore(', 'تاريخ الصلاحية غير صحيح']) {
            if (!html.includes(token)) throw new Error('Missing core feature: ' + token);
          }
          const vm = require('vm');
          function extractFunction(source, name) {
            const start = source.indexOf('function ' + name + '(');
            if (start < 0) throw new Error('Missing testable function: ' + name);
            const open = source.indexOf('{', start);
            let depth = 0, quote = '', escaped = false;
            for (let i = open; i < source.length; i++) {
              const c = source[i];
              if (quote) {
                if (escaped) escaped = false;
                else if (c === '\\\\') escaped = true;
                else if (c === quote) quote = '';
                continue;
              }
              if (c === "'" || c === '"' || c === '`') { quote = c; continue; }
              if (c === '{') depth++;
              if (c === '}' && --depth === 0) return source.slice(start, i + 1);
            }
            throw new Error('Unclosed function: ' + name);
          }
          const context = { Date, Math, String, Number };
          vm.createContext(context);
          vm.runInContext(extractFunction(scripts[0][1], 'expiryDays') + ';' + extractFunction(scripts[0][1], 'reportMonth'), context);
          const expiry = context.expiryDays;
          if (expiry('2026-02-30') !== null || expiry('not-a-date') !== null || expiry('') !== null) throw new Error('Expiry validation accepted an invalid date');
          const today = new Date();
          const todayIso = [today.getFullYear(), String(today.getMonth()+1).padStart(2,'0'), String(today.getDate()).padStart(2,'0')].join('-');
          if (expiry(todayIso) !== 0) throw new Error('Expiry calculation failed for today');
          if (context.reportMonth('20/11/2026, 10:30:00') !== '2026-11' || context.reportMonth('2026-04-15') !== '2026-04' || context.reportMonth('2026-04') !== '2026-04' || context.reportMonth('2026-02-31') !== '' || context.reportMonth('2026-13-01') !== '' || context.reportMonth('31/02/2026') !== '' || context.reportMonth('unknown') !== '') throw new Error('Monthly report date parsing failed');
          vm.runInContext(extractFunction(scripts[0][1], 'cartQty'), context);
          context.renderCart = () => {};
          context.toast = message => { context.lastToast = message; };
          context.cart = [{id:'p1',qty:2}];
          context.db = {products:[{id:'p1',qty:2}]};
          context.cartQty('p1',1);
          if (context.cart[0].qty !== 2) throw new Error('Cart quantity exceeded available stock');
          context.cartQty('p1',-2);
          if (context.cart.length !== 0) throw new Error('Cart item was not removed at zero quantity');
          context.cart = [{id:'missing',qty:1}];
          context.cartQty('missing',1);
          if (context.cart.length !== 0) throw new Error('Missing product remained in cart');
          context.cart = [{id:'p2',qty:1}];
          context.db = {products:[{id:'p2',qty:5}]};
          context.cartQty('p2',1);
          if (context.cart[0].qty !== 2) throw new Error('Cart quantity increment failed');
          context.cartQty('p2',-1);
          if (context.cart[0].qty !== 1) throw new Error('Cart quantity decrement failed');
          console.log('Business logic checks passed: expiry dates, monthly date parsing, and POS cart quantity boundaries.');
          console.log('Static checks passed: JavaScript syntax, unique HTML IDs, core workflows.');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

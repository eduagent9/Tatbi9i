name: Publish Tatbiqi Web Preview

on:
  workflow_dispatch:
  push:
    branches:
      - phase2/distribution-completion
    paths:
      - 'app-v2/**'
      - '.github/workflows/web-preview.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tatbiqi-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-v2
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Run tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Upload web preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: app-v2/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

name: Build Tatbiqi Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/sqlcipher-first-open-verification

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Run tests
        run: npm test
      - name: Type-check and build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor plugins and assets
        run: npx cap sync android
      - name: Configure ML Kit camera scanning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = path.read_text(encoding='utf-8')
          camera_permission = '    <uses-permission android:name="android.permission.CAMERA" />\n'
          if 'android.permission.CAMERA' not in manifest:
              manifest = manifest.replace('<application', camera_permission + '<application', 1)

          mlkit_metadata = '        <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />\n'
          if 'com.google.mlkit.vision.DEPENDENCIES' not in manifest:
              application_tag = re.search(r'<application\b[^>]*>', manifest, re.DOTALL)
              if not application_tag:
                  raise SystemExit('AndroidManifest.xml has no application tag.')
              insert_at = application_tag.end()
              manifest = manifest[:insert_at] + '\n' + mlkit_metadata + manifest[insert_at:]

          path.write_text(manifest, encoding='utf-8')
          print('Camera permission and ML Kit barcode dependency metadata are configured.')
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Smoke-test first launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            APK="app-v2/android/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb shell am force-stop com.eduagent.tatbiqi
            adb shell monkey -p com.eduagent.tatbiqi 1
            sleep 15
            if ! adb shell pidof com.eduagent.tatbiqi >/dev/null; then
              adb logcat -d -t 3000 > /tmp/tatbiqi-logcat.txt
              cat /tmp/tatbiqi-logcat.txt
              echo "Tatbiqi process exited during first launch."
              exit 1
            fi
            adb logcat -d -t 3000 > /tmp/tatbiqi-logcat.txt
            if grep -E "FATAL EXCEPTION|Unable to start activity" /tmp/tatbiqi-logcat.txt; then
              echo "Android reported a fatal startup error."
              exit 1
            fi
            adb shell uiautomator dump /sdcard/tatbiqi-window.xml >/dev/null
            adb pull /sdcard/tatbiqi-window.xml /tmp/tatbiqi-window.xml >/dev/null
            if grep -q "تعذر تأكيد تشفير قاعدة البيانات" /tmp/tatbiqi-window.xml; then
              echo "First launch is still blocked by SQLCipher verification."
              cat /tmp/tatbiqi-window.xml
              exit 1
            fi
            if ! grep -Eq "إعداد دخول المالك|تسجيل الدخول" /tmp/tatbiqi-window.xml; then
              echo "The app did not reach its first-run authentication screen."
              cat /tmp/tatbiqi-window.xml
              exit 1
            fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tatbiqi-android-debug
          path: app-v2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
